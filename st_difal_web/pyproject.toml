[project]
name = "conferidor-nfe-web"
version = "0.1.0"
description = "Clone WEB do conferidor fiscal de NF-e"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "Flask>=3.1.3,<4",
    "openpyxl>=3.1.0",
    "pymupdf>=1.28.0",
    "pypdf>=6.8.0",
    "waitress>=3.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--basetemp=.pytest-temp"
