[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "supreme-common"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.27,<1", "sqlalchemy>=2,<3", "PyJWT[crypto]>=2.10,<3", "defusedxml>=0.7", "python-dotenv>=1"]
[project.optional-dependencies]
redis = ["redis>=5,<7"]
postgres = ["psycopg[binary]>=3.2"]
[tool.setuptools.packages.find]
where = ["src"]
