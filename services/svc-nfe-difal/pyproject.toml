[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "svc-nfe-difal"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
    "supreme-common",
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.8,<3",
    "python-multipart>=0.0.9",
    "openpyxl>=3.1",
    "pymupdf>=1.28",
    "pypdf>=6.8"
]
[tool.uv.sources]
supreme-common = { workspace = true }
[tool.setuptools.packages.find]
where = ["src"]
[tool.setuptools.package-data]
"*" = ["static/**/*", "samples/*.xml"]
[tool.pytest.ini_options]
testpaths = ["tests"]
